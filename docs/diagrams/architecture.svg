<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">Architecture of architecture-leadership-design-review: documents, a linter and fitness functions</title>
<desc id="d">The repository is a document set and a toolkit. On the left, inside Documents in the repository: the draft Proposal, the Review records that cite the requirements, the NFRs with 6 requirements, the Checklist with 7 questions, and model/uploads.toml with the facts and scenarios. On the right, an operator runs make run, which calls the design-review command in a standard-library-only package. The Use cases read documents through the DocumentStore, parse them with the Markdown parsers, and apply the Rules with PRP, REQ, REV and CHK codes. ModelSource reads the TOML model for the Fitness functions, which check capacity, the queue wait and the write order. Rule findings and fitness verdicts go to the Report, which writes build/report.md and sets an exit code of 0, 1 or 2. In amber, a note says the draft fails: one worker does 0.5 a second against an average of 3.89 a second, and its write order can lose an upload.</desc>
