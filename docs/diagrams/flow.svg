<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">One make run of architecture-leadership-design-review in eight rows</title>
<desc id="d">Eight rows run top to bottom across five lanes: Use cases, Report, Parsers, Rules and Fitness. The use cases read and parse the documents, the rules check the requirements and proposal, match each review to its requirements, check findings, classes and the record, and check the checklist against the NFRs. Row 6 runs the fitness functions on the uploads model, with an average of 3.89 uploads a second over 216,000 seconds. In amber, row 6x: the draft fails as expected, with one worker and a p95 wait of 1,390,800 seconds. Row 7 writes both results to the report, ending with OK: 6 documents checked, 0 errors, 0 warnings.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="759" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="758" rx="16"/>
<text class="title" x="48" y="68">One make run over the design review</text>
<text class="caption" x="48" y="100">The linter checks every finding; the amber row is the draft failing its own requirement, as expected.</text>

<rect class="svc" x="410" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="470" y="158" text-anchor="middle">Use cases</text>
<rect class="svc" x="560" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="620" y="158" text-anchor="middle">Report</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">Parsers</text>
<rect class="svc" x="860" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="920" y="158" text-anchor="middle">Rules</text>
<rect class="svc" x="1015" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1075" y="158" text-anchor="middle">Fitness</text>
<path class="hair" d="M470 176V690M620 176V690M770 176V240M920 176V496M1075 176V626"/>
<path class="hair" d="M66 216V664"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Read the documents</text>
<text class="sub" x="96" y="232">requirements, proposal, reviews</text>
<path class="sync" d="M470 216H770"/>
<text class="label t-accent" x="632" y="206">read, parse</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Requirements and proposal</text>
<text class="sub" x="96" y="296">REQ001-004, PRP001-004</text>
<path class="sync" d="M470 280H920"/>
<text class="label t-accent" x="782" y="270">REQ, PRP</text>

<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Match review to requirements</text>
<text class="sub" x="96" y="360">same targets, a verdict each</text>
<path class="sync" d="M470 344H920"/>
<text class="label t-accent" x="782" y="334">REV002-004</text>

<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Findings, classes, record</text>
<text class="sub" x="96" y="424">taste said aloud, owners, dates</text>
<path class="sync" d="M470 408H920"/>
<text class="label t-accent" x="782" y="398">REV005-012</text>

<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Checklist against the NFRs</text>
<text class="sub" x="96" y="488">every finding category covered</text>
<path class="sync" d="M470 472H920"/>
<text class="label t-accent" x="782" y="462">CHK001-003</text>

<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">Fitness: workers and writes</text>
<text class="sub" x="96" y="552">3.89/s average, 216,000 s</text>
<path class="sync" d="M470 536H1075"/>
<text class="label t-accent" x="932" y="526">uploads.toml</text>

<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="596">The draft fails, as expected</text>
<text class="sub" x="96" y="616">1 worker: p95 wait 1,390,800 s</text>
<path class="fail" d="M1075 600H470"/>
<text class="label t-warn" x="932" y="590">draft1: FAIL</text>

<circle class="dot-g" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="660">Write the report</text>
<text class="sub" x="96" y="680">both results to build/report.md</text>
<path class="sync" d="M470 664H620"/>
<text class="label t-accent" x="482" y="654">write</text>
<rect class="win" x="650" y="644" width="440" height="40" rx="10"/>
<text class="label b t-good" x="666" y="669">OK: 6 documents checked, 0 errors, 0 warnings</text>

<path class="sync" d="M48 716H112"/><text class="legend" x="124" y="721">sync call</text>
<path class="fail" d="M696 716H760"/><text class="legend" x="772" y="721">failure path</text>
</svg>
